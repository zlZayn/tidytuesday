<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TidyTuesday Visualization Hub</title>
<!--
  ============================================================================
  本文件是模板，不是产物。真正的根 index.html 由 code/update_site.R 读取本文件、
  替换四个占位符后生成（每次 push 后 CI 重跑，手改根 index.html 会被覆盖）：

    HUB_CSS    <- assets/site/hub.css   内容
    HUB_DATA   <- 各周 {date,title,kind,src,repo} 的 JSON
    HUB_JS     <- assets/site/hub.js    内容
    REPO_URL   <- 仓库地址（头部 GitHub 链接）

  四个占位符在模板里写成「at-at 包裹」的形式，不用双花括号，避免与 CSS/JS 的
  大量花括号混淆。
  ⚠ 本注释刻意不写出占位符的字面写法：替换是全局的（gsub 替换所有出现），
    注释里若出现字面占位符，会被一并替换成 CSS/JS/JSON 正文，把注释撑爆并重复内容。
    脚本另有「每个占位符必须恰好出现一次」的硬校验来兜住这类事故。
  ============================================================================
-->
<style>
@@HUB_CSS@@
</style>
</head>
<body>

<!-- 八爪鱼图标定义一次，两处 <use> 复用 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-octo" viewBox="0 0 16 16">
    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
  </symbol>
</svg>

<header class="site-header">
  <div class="brand">
    <h1>TidyTuesday Visualization Hub</h1>
    <a class="repo-link" href="@@REPO_URL@@" target="_blank" rel="noopener" title="zlZayn / tidytuesday">
      <svg class="octo" width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-octo"></use></svg>
      <span class="who">zlZayn</span>
    </a>
  </div>
  <span class="tagline">每周 R 数据可视化 · 点击左侧周次按需加载 · 自动部署</span>
</header>

<div class="layout">
  <nav class="weeks" aria-label="周次列表">
    <h2>Weekly Reports</h2>
    <ul id="weeks-list"></ul>
  </nav>

  <div class="content">
    <div class="meta">
      <h3 id="viz-title"></h3>
      <span class="date" id="viz-date"></span>
    </div>
    <!-- 面板在首次点击某个 tab 时才插入这里；首屏只有空态提示，
         不创建 iframe，也不产生任何报告请求 -->
    <div class="stage" id="stage">
      <div class="empty" id="stage-empty">从左侧选择一个周次，加载该周报告</div>
    </div>
  </div>
</div>

<footer class="site-footer" id="hub-foot"></footer>

<script type="application/json" id="hub-data">
@@HUB_DATA@@
</script>

<script>
@@HUB_JS@@
</script>
</body>
</html>
