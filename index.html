<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TidyTuesday 可视化 — zlZayn</title>
<!--
  ============================================================================
  本文件是模板，不是产物。真正的根 index.html 由 code/update_site.R 读取本文件、
  替换四个占位符后生成（每次 push 后 CI 重跑，手改根 index.html 会被覆盖）：

    HUB_CSS    <- assets/site/hub.css   内容
    HUB_DATA   <- 各周 {date,title,kind,src,repo} 的 JSON
    HUB_JS     <- assets/site/hub.js    内容
    REPO_URL   <- 仓库地址（顶栏 GitHub 链接）

  四个占位符在模板里写成「at-at 包裹」的形式，不用双花括号，避免与 CSS/JS 的
  大量花括号混淆。
  ⚠ 本注释刻意不写出占位符的字面写法：替换是全局的（gsub 替换所有出现），
    注释里若出现字面占位符，会被一并替换成 CSS/JS/JSON 正文，把注释撑爆并重复内容。
    脚本另有「每个占位符必须恰好出现一次」的硬校验来兜住这类事故。
  ============================================================================
-->
<style>
/* ==========================================================================
   hub.css — 站点入口页（根 index.html）样式
   --------------------------------------------------------------------------
   这个文件不直接被浏览器加载：code/update_site.R 读取它，内联进
   assets/site/index.template.html 的样式占位符，产出根 index.html。
   （此处刻意不写出占位符的字面写法——脚本会校验替换后不残留占位符。）

   视觉语言取自各周报告自身，不另立一套：
     - 字体栈与报告一致：cosmo 主题的 "Source Sans Pro" 栈
     - 前景 #373a3c / 弱化 rgba(55,58,60,.75)：cosmo 的 body 色与 secondary
     - 边框 #e1e1e1：cosmo --bs-border-color
     - 圆角 6px / 8px：cosmo --bs-border-radius / -lg
     - 强调色 #2780e3：cosmo --bs-primary（报告里的链接与按钮同色）
     - 品牌字色渐变：复用 assets/styles.css 的 h1.title 七色阶梯
     - 悬浮提示的黑色框：对齐报告内 tippy 的观感（#333 底、白字、4px 圆角）
   ========================================================================== */

:root {
  --hub-header-h: 44px;

  --hub-bg: #fff;
  --hub-fg: #373a3c;
  --hub-muted: rgba(55, 58, 60, .75);   /* 5.35:1 于白底 */
  /* 0.70 是满足 WCAG AA 4.5:1 的最小值（实测 4.62:1）。
     它大量用于 11–12px 的日期与「生成于」，低于此值会掉到 3:1 一带，
     对正文尺寸的文字属不合格。 */
  --hub-faint: rgba(55, 58, 60, .70);
  --hub-border: #e1e1e1;
  --hub-tertiary: #f8f9fa;
  --hub-secondary: #e9ecef;
  --hub-primary: #2780e3;
  --hub-focus: rgba(39, 128, 227, .25);

  --hub-radius: 6px;
  --hub-shadow-sm: 0 .125rem .25rem rgba(0, 0, 0, .075);
  --hub-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15);

  --hub-font: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI",
              Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei",
              sans-serif;

  --hub-ease: cubic-bezier(.2, .8, .2, 1);

  /* 字号阶梯：五档，跨控件复用，避免各处随手写数字。
     品牌 > 正文 > 提示 > 元信息 > 微标  */
  --hub-fs-brand: 15px;
  --hub-fs-body: 14px;
  --hub-fs-tip: 12.5px;
  --hub-fs-meta: 12px;
  --hub-fs-micro: 11px;

  /* 尺寸阶梯：按钮方框、图标方框、小标签行高
     （SVG 的宽高统一由 CSS 给，模板里不写 width/height，避免两处漂移） */
  --hub-box-btn: 30px;
  --hub-box-icon: 26px;
  --hub-label-h: 16px;

  /* 八爪鱼图标两档：顶栏与抽屉条目 */
  --hub-octo-brand: 15px;
  --hub-octo-item: 13px;

  /* 悬浮提示：对齐报告内 tippy 的黑色框 */
  --hub-tip-bg: #333;
  --hub-tip-fg: #fff;
  --hub-tip-radius: 4px;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;               /* 内容区自身不滚动，避免双滚动条 */
}

body {
  font-family: var(--hub-font);
  font-size: var(--hub-fs-body);
  line-height: 1.5;
  color: var(--hub-fg);
  background: var(--hub-bg);
  -webkit-font-smoothing: antialiased;
}

/* 统一的图标按钮外观：只放 SVG，文字进悬浮提示 */
.hub-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  width: var(--hub-box-btn);
  height: var(--hub-box-btn);
  padding: 0;
  color: var(--hub-fg);
  background: var(--hub-bg);
  border: 1px solid var(--hub-border);
  border-radius: var(--hub-radius);
  cursor: pointer;
  transition: background-color .15s var(--hub-ease),
              border-color .15s var(--hub-ease),
              color .15s var(--hub-ease);
}
.hub-icon-btn:hover { background: var(--hub-tertiary); border-color: #d0d0d0; }
.hub-icon-btn:focus-visible { outline: 3px solid var(--hub-focus); outline-offset: 1px; }

/* ---------- 顶栏：单行、固定、不随内容滚动 ---------- */
.hub-header {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 30;
  height: var(--hub-header-h);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 10px;
  background: var(--hub-bg);
  border-bottom: 1px solid var(--hub-border);
}

/* 品牌：主体走 styles.css 的七色渐变，「可视化」退为弱化后缀。
   作者署名刻意不在这里——本站是对官方数据的个人练习，署名只在八爪鱼提示里。 */
.hub-brand {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
/* 字标内部按基线对齐，让大小两档文字坐在同一基线上；
   八爪鱼图标则在 .hub-brand 里垂直居中，不受基线影响。 */
.hub-brand .wordmark {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  min-width: 0;
}
.hub-brand .name {
  font-size: var(--hub-fs-brand);
  font-weight: 700;
  letter-spacing: -.01em;
  white-space: nowrap;
  background-image: linear-gradient(90deg,
      #0e8056, #0e8074, #0e6074, #0e4074, #100e74, #300e74, #570e74,
      #570e74, #300e74, #100e74, #0e4074, #0e6074, #0e8074, #0e8056);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}
/* 「可视化」是后缀说明，比主体小一档、用同一个字重的常规体，
   两者基线对齐由 flex 的 align-items: baseline 保证 */
.hub-brand .sub {
  font-size: var(--hub-fs-tip);
  font-weight: 400;
  color: var(--hub-faint);
  white-space: nowrap;
}
.hub-brand .repo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--hub-box-icon);
  height: var(--hub-box-icon);
  color: var(--hub-faint);
  text-decoration: none;
  border-radius: var(--hub-radius);
}
.hub-brand .repo:hover { color: var(--hub-primary); background: var(--hub-tertiary); }
.hub-brand .repo:focus-visible { outline: 3px solid var(--hub-focus); outline-offset: 1px; }

/* 八爪鱼图标：尺寸只在这里定义一次，模板与 JS 里的 SVG 都不写 width/height，
   免得改大小时漏改某处导致两个八爪鱼不一样大。 */
.octo {
  display: block;
  fill: currentColor;
  flex-shrink: 0;
  width: var(--hub-octo-brand);
  height: var(--hub-octo-brand);
}
/* 列表条目里的小一档 */
.week .src .octo {
  width: var(--hub-octo-item);
  height: var(--hub-octo-item);
}

/* 线条图标：同样是 CSS 唯一定尺寸。
   汉堡包按视觉重心压扁一点（3 条横线，宽高比约 15:13），
   关闭叉按方形。两者都用 currentColor，跟随按钮文字色。 */
.icon-bars,
.icon-x {
  display: block;
  flex-shrink: 0;
}
.icon-bars { width: 15px; height: 13px; fill: currentColor; }
.icon-x {
  width: 12px; height: 12px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
}

/* 右侧：仅当前周，日期与标题之间用弱化色的小间隔而不是字符「·」 */
.hub-meta {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: baseline;
  justify-content: flex-end;
  gap: 8px;
  font-size: var(--hub-fs-tip);
  color: var(--hub-muted);
}
.hub-meta .now {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hub-meta .now .d {
  color: var(--hub-faint);
  font-variant-numeric: tabular-nums;
  margin-right: 8px;          /* 间距由样式给，不写文本分隔符 */
}
.hub-meta .now .t { color: var(--hub-fg); font-weight: 600; }

/* ---------- 内容区：紧贴顶栏下方，零内边距 ---------- */
.hub-main {
  position: fixed;
  inset: var(--hub-header-h) 0 0 0;
  min-width: 0;
}
.hub-stage { position: absolute; inset: 0; }

/* 每周一个面板：懒创建，只有激活的那个显示。
   已加载过的面板留在 DOM 里，切回零请求。 */
.panel { position: absolute; inset: 0; display: none; }
.panel[data-active="true"] { display: block; }

/* iframe 铺满内容区，hub 不加任何 padding / border / margin */
.panel iframe {
  display: block;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  border: 0;
  background: var(--hub-bg);
}

/* 提示层与无 JS 兜底：同一套居中文本排布 */
.panel .hint,
.hub-noscript {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  font-size: var(--hub-fs-body);
  color: var(--hub-muted);
}
.panel .hint {
  z-index: 1;
  background: var(--hub-bg);
}
.panel .hint[hidden] { display: none; }
.hub-noscript a { color: var(--hub-primary); }

/* ---------- 抽屉：悬浮层，覆盖内容，默认收起 ---------- */
.hub-scrim {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(0, 0, 0, .35);
  opacity: 0;
  visibility: hidden;
  /* visibility 用 0 时长 + 延迟：关闭时等淡出结束再隐藏 */
  transition: opacity .2s var(--hub-ease), visibility 0s linear .2s;
}
.hub-scrim[data-open="true"] {
  opacity: 1;
  visibility: visible;
  transition: opacity .2s var(--hub-ease), visibility 0s;
}

.hub-drawer {
  position: fixed;
  z-index: 50;
  top: 0;
  bottom: 0;
  left: 0;
  width: min(340px, 88vw);
  display: flex;
  flex-direction: column;
  background: var(--hub-bg);
  border-right: 1px solid var(--hub-border);
  box-shadow: var(--hub-shadow);
  transform: translateX(-102%);
  visibility: hidden;
  /* transform 做滑出动画；visibility 必须瞬时生效（0 时长、无延迟），
     否则打开瞬间元素仍是 hidden —— 而 hidden 元素无法获得焦点，
     焦点移入抽屉会静默失败。关闭方向才需要延迟，等滑出播完再隐藏。 */
  transition: transform .24s var(--hub-ease), visibility 0s linear .24s;
  overscroll-behavior: contain;
}
.hub-drawer[data-open="true"] {
  transform: none;
  visibility: visible;
  transition: transform .24s var(--hub-ease), visibility 0s;
}

.hub-drawer .dh {
  flex: 0 0 auto;
  padding: 12px 8px 11px 14px;
  border-bottom: 1px solid var(--hub-border);
}
.hub-drawer .dh-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.hub-drawer .dh-id {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.hub-drawer .dh h2 {
  margin: 0;
  font-size: var(--hub-fs-micro);
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--hub-faint);
  white-space: nowrap;
}
/* 小标签：周数用它承载，替代「N 周 · …」这类文本拼串 */
.chip {
  display: inline-block;
  padding: 0 6px;
  font-size: var(--hub-fs-micro);
  font-weight: 600;
  line-height: var(--hub-label-h);
  color: var(--hub-muted);
  background: var(--hub-tertiary);
  border: 1px solid var(--hub-border);
  border-radius: 999px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
/* 生成日期：与标题左对齐、再小半档，明确是「本页生成于」而非某周日期 */
.hub-drawer .dh-gen {
  margin: 7px 0 0;
  font-size: var(--hub-fs-micro);
  color: var(--hub-faint);
  font-variant-numeric: tabular-nums;
}
/* 抽屉里的关闭按钮沿用图标按钮外观，但去掉边框与底色（hover 才显形） */
.hub-close {
  border-color: transparent;
  background: none;
  color: var(--hub-muted);
}
.hub-close:hover { background: var(--hub-tertiary); border-color: transparent; color: var(--hub-fg); }

.hub-weeks {
  flex: 1 1 auto;
  margin: 0;
  padding: 6px;
  list-style: none;
  overflow-y: auto;
}
.week { display: flex; align-items: stretch; gap: 2px; }

.week .tab {
  flex: 1 1 auto;
  min-width: 0;
  text-align: left;
  font: inherit;
  font-size: var(--hub-fs-body);
  color: var(--hub-fg);
  background: none;
  border: 0;
  border-radius: var(--hub-radius);
  padding: 8px 10px;
  cursor: pointer;
  transition: background-color .15s var(--hub-ease);
}
.week .tab:hover { background: var(--hub-tertiary); }
.week .tab:focus-visible { outline: 3px solid var(--hub-focus); outline-offset: -1px; }
.week .tab[aria-current="true"] {
  background: var(--hub-secondary);
  box-shadow: inset 3px 0 0 var(--hub-primary);
}
.week .tab .t {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.week .tab[aria-current="true"] .t { font-weight: 600; }
.week .tab .d {
  display: block;
  margin-top: 1px;
  font-size: var(--hub-fs-meta);
  color: var(--hub-faint);
  font-variant-numeric: tabular-nums;
}
/* 「数据检查」标记：回退周的提示标签，不作为标题文字的一部分 */
.week .tab .kind,
.hub-meta .now .kind {
  display: inline-block;
  margin-left: 6px;
  padding: 0 5px;
  font-size: var(--hub-fs-micro);
  font-weight: 600;
  line-height: var(--hub-label-h);
  vertical-align: 1px;
  color: var(--hub-primary);
  background: var(--hub-tertiary);
  border: 1px solid var(--hub-border);
  border-radius: var(--hub-radius);
}

/* 每周 tab 旁边的 GitHub 八爪鱼 */
.week .src {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--hub-box-btn);
  color: var(--hub-faint);
  border-radius: var(--hub-radius);
  text-decoration: none;
}
.week .src:hover { color: var(--hub-primary); background: var(--hub-tertiary); }
.week .src:focus-visible { outline: 3px solid var(--hub-focus); outline-offset: -1px; }

/* ---------- 悬浮提示：报告内 tippy 同款黑色框 ---------- */
.hub-tip {
  position: fixed;
  z-index: 60;
  left: 0;
  top: 0;
  max-width: min(320px, calc(100vw - 16px));
  padding: 5px 9px;
  font-family: var(--hub-font);
  font-size: var(--hub-fs-tip);
  line-height: 1.4;
  color: var(--hub-tip-fg);
  background: var(--hub-tip-bg);
  border-radius: var(--hub-tip-radius);
  box-shadow: var(--hub-shadow-sm);
  pointer-events: none;
  opacity: 0;
  transition: opacity .12s var(--hub-ease);
}
.hub-tip[data-show="true"] { opacity: 1; }

/* 小箭头：指向目标。水平位置由 JS 写入 --arrow-x（默认居中） */
.hub-tip::after {
  content: "";
  position: absolute;
  left: var(--arrow-x, 50%);
  margin-left: -4px;
  border: 4px solid transparent;
}
.hub-tip[data-place="bottom"]::after { bottom: 100%; border-bottom-color: var(--hub-tip-bg); }
.hub-tip[data-place="top"]::after { top: 100%; border-top-color: var(--hub-tip-bg); }

/* ---------- 窄屏 ---------- */
@media (max-width: 560px) {
  :root { --hub-header-h: 42px; }

  /* 顶栏只保留「日期 + 标题」，标题不再加粗，避免与品牌争视觉重量 */
  .hub-meta .now .t { font-weight: 400; }

  /* 日期在窄屏仍保留：它是区分周次最可靠的信息，
     但字号降半档、颜色更弱，让标题占主位 */
  .hub-meta .now .d { font-size: var(--hub-fs-micro); }

  .hub-drawer { width: 88vw; }
}

/* 更窄（约 375px）：品牌继续收紧，标题让步给省略号 */
@media (max-width: 400px) {
  .hub-brand .sub { display: none; }        /* 只留 TidyTuesday */
  .hub-header { gap: 8px; padding: 0 8px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<!-- 八爪鱼图标定义一次，多处 <use> 复用 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-octo" viewBox="0 0 16 16">
    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
  </symbol>
</svg>

<!-- 顶栏：单行、固定。左侧唤出按钮（纯图标 + 悬浮提示）+ 品牌 + 仓库图标，右侧当前周 -->
<header class="hub-header">
  <button type="button" class="hub-icon-btn" id="hub-menu"
          aria-label="打开周次列表" aria-expanded="false" aria-controls="hub-drawer"
          data-tip="周次列表（M）">
    <svg class="icon-bars" viewBox="0 0 15 13" aria-hidden="true">
      <rect x="0" y="0" width="15" height="1.8" rx="0.9"/>
      <rect x="0" y="5.6" width="15" height="1.8" rx="0.9"/>
      <rect x="0" y="11.2" width="15" height="1.8" rx="0.9"/>
    </svg>
  </button>

  <!-- 品牌：作者署名不写在这里（本站是对官方数据的个人练习），只在八爪鱼提示里出现 -->
  <div class="hub-brand">
    <span class="wordmark">
      <span class="name">TidyTuesday</span>
      <span class="sub">可视化</span>
    </span>
    <a class="repo" href="https://github.com/zlZayn/tidytuesday" target="_blank" rel="noopener"
       aria-label="在 GitHub 打开 zlZayn/tidytuesday 仓库"
       data-tip="zlZayn/tidytuesday">
      <svg class="octo" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-octo"></use></svg>
    </a>
  </div>

  <div class="hub-meta">
    <span class="now" id="hub-now" aria-live="polite"></span>
  </div></header>

<!-- 内容区：紧贴顶栏，iframe 全屏，hub 不加任何内边距 -->
<main class="hub-main">
  <div class="hub-stage" id="stage">
    <!-- 无 JS 时不执行任何加载；给出直达链接作为兜底 -->
    <noscript>
      <div class="hub-noscript">
        需要启用 JavaScript 才能在此切换周次。也可直接打开
        <a href="./weeks/">weeks/</a> 目录浏览各周报告。
      </div>
    </noscript>
  </div>
</main>

<!-- 抽屉：悬浮层，默认收起，打开时覆盖在内容之上 -->
<div class="hub-scrim" id="hub-scrim" data-open="false" aria-hidden="true"></div>

<nav class="hub-drawer" id="hub-drawer" data-open="false"
     role="dialog" aria-modal="true" aria-labelledby="hub-drawer-title">
  <!-- 抽屉顶：标题 + 周数小标签 +（下一行）本站生成日期。
       生成日期放这里而不是顶栏：它表示「本页何时生成」，与各周自身的日期
       （列表项里 2026-08-25 那种）分开，避免被读成某一周。 -->
  <div class="dh">
    <div class="dh-head">
      <div class="dh-id">
        <h2 id="hub-drawer-title">Weekly Reports</h2>
        <span class="chip" id="hub-count"></span>
      </div>
      <button type="button" class="hub-icon-btn hub-close" id="hub-close"
              aria-label="关闭周次列表" data-tip="关闭（Esc）">
        <svg class="icon-x" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M1 1 L11 11 M11 1 L1 11"/>
        </svg>
      </button>
    </div>
    <p class="dh-gen" id="hub-gen"></p>
  </div>
  <ul class="hub-weeks" id="weeks-list"></ul>
</nav>

<script>
/* ==========================================================================
   hub.js — 站点入口页（根 index.html）的抽屉、悬浮提示与按需加载逻辑
   --------------------------------------------------------------------------
   这个文件不直接被浏览器加载：code/update_site.R 读取它，内联进
   assets/site/index.template.html 的脚本占位符，产出根 index.html。
   （此处刻意不写出占位符的字面写法——脚本会校验替换后不残留占位符。）

   加载策略（多文件 + 按需加载）：
     - 进入页面即加载**最新一周**（列表首项），只有这一份报告被请求。
     - 之后选某周时，若该周面板还没建，才创建 <iframe> 并设 src。
     - 已创建的面板留在 DOM 中，切回只切 data-active，零请求。

   抽屉交互：
     - 打开：点顶栏图标按钮 / 快捷键 m
     - 关闭：点遮罩、按 Esc、选中某个周之后自动收起
     - 焦点：打开移入抽屉，关闭回到唤出按钮；Tab 在抽屉内循环

   悬浮提示：任何带 data-tip 的元素都会显示统一的黑色提示框
   （外观对齐报告内 tippy），鼠标悬停与键盘聚焦都会触发。
   ========================================================================== */
(function () {
  "use strict";

  var data = JSON.parse(document.getElementById("hub-data").textContent);
  var weeks = data.weeks;

  var listEl   = document.getElementById("weeks-list");
  var stageEl  = document.getElementById("stage");
  var nowEl    = document.getElementById("hub-now");
  var countEl  = document.getElementById("hub-count");
  var genEl    = document.getElementById("hub-gen");
  var drawerEl = document.getElementById("hub-drawer");
  var scrimEl  = document.getElementById("hub-scrim");
  var menuEl   = document.getElementById("hub-menu");
  var closeEl  = document.getElementById("hub-close");

  var FOCUSABLE = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';

  /* 面板表：index -> { panel, frame }
     用来判断「已建则切显隐、未建才创建」。 */
  var panels = {};
  var lastFocus = null;

  function el(tag, cls) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    return n;
  }

  /* ---------------- 悬浮提示 ---------------- */

  /* 显示/隐藏的延迟（毫秒）。
     悬停要有「等一会儿才浮现」的手感，和报告里 tippy 的观感一致；
     鼠标快速扫过时不弹提示，避免闪烁。
     键盘聚焦不延迟：键盘用户等 0.4 秒才看到提示是纯粹的阻碍。 */
  var TIP_SHOW_DELAY = 400;
  var TIP_HIDE_DELAY = 80;

  var tip = el("div", "hub-tip");
  tip.id = "hub-tip";
  tip.setAttribute("role", "tooltip");
  document.body.appendChild(tip);
  var tipFor = null;
  var tipShowTimer = null;
  var tipHideTimer = null;

  function tipClearTimers() {
    if (tipShowTimer) { clearTimeout(tipShowTimer); tipShowTimer = null; }
    if (tipHideTimer) { clearTimeout(tipHideTimer); tipHideTimer = null; }
  }

  function tipReveal(target) {
    var text = target.getAttribute("data-tip");
    if (!text) { return; }
    tipFor = target;
    tip.textContent = text;
    tipPlace(target);                  /* 先量好位置再显示，避免出现时跳动 */
    tip.setAttribute("data-show", "true");
  }

  /* delay 缺省用 TIP_SHOW_DELAY；键盘聚焦传 0 */
  function tipSchedule(target, delay) {
    tipClearTimers();
    tipFor = target;
    if (delay <= 0) { tipReveal(target); return; }
    tipShowTimer = setTimeout(function () {
      tipShowTimer = null;
      /* 延迟期间目标可能已被移出或被换掉 */
      if (tipFor === target && document.contains(target)) { tipReveal(target); }
    }, delay);
  }

  function tipPlace(target) {
    var r = target.getBoundingClientRect();
    var tr = tip.getBoundingClientRect();
    var place = "bottom";
    var top = r.bottom + 8;
    if (top + tr.height > window.innerHeight - 4) {   /* 底部放不下就翻到上方 */
      top = r.top - tr.height - 8;
      place = "top";
    }
    var left = r.left + r.width / 2 - tr.width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - tr.width - 8));
    tip.style.left = Math.round(left) + "px";
    tip.style.top = Math.round(Math.max(4, top)) + "px";
    tip.setAttribute("data-place", place);
    /* 箭头始终指向目标中心，而不是提示框中心（提示框可能被夹到屏幕内） */
    tip.style.setProperty("--arrow-x",
      Math.round(r.left + r.width / 2 - left) + "px");
  }

  /* immediate=true 立即隐藏（点走、Esc、滚动等场景）；否则留一点宽限时间，
     使鼠标在相邻元素间移动时提示不闪断。 */
  function tipHide(immediate) {
    tipClearTimers();
    tipFor = null;
    var doHide = function () {
      tipHideTimer = null;
      tip.setAttribute("data-show", "false");
    };
    if (immediate) { doHide(); return; }
    tipHideTimer = setTimeout(doHide, TIP_HIDE_DELAY);
  }

  function tipFrom(node) {
    return (node && node.closest) ? node.closest("[data-tip]") : null;
  }

  document.addEventListener("mouseover", function (e) {
    var t = tipFrom(e.target);
    if (!t) { if (tipFor) { tipHide(false); } return; }
    if (t === tipFor && (tipShowTimer || tip.getAttribute("data-show") === "true")) {
      return;                              /* 已在同一目标上，别重置计时 */
    }
    tipSchedule(t, TIP_SHOW_DELAY);
  });

  document.addEventListener("mouseout", function (e) {
    if (!tipFor && !tipShowTimer) { return; }
    var to = tipFrom(e.relatedTarget);
    if (to === tipFor) { return; }
    tipHide(false);
  });

  /* 键盘聚焦立即显示（与 aria-label 互补，不替代） */
  document.addEventListener("focusin", function (e) {
    var t = tipFrom(e.target);
    if (t) { tipSchedule(t, 0); } else { tipHide(true); }
  });
  document.addEventListener("focusout", function () { tipHide(false); });

  document.addEventListener("click", function () { tipHide(true); });
  window.addEventListener("resize", function () { tipHide(true); });
  window.addEventListener("scroll", function () { tipHide(true); }, true);

  /* ---------------- 抽屉开关 ---------------- */

  function drawerOpen() {
    return drawerEl.getAttribute("data-open") === "true";
  }

  function openDrawer() {
    if (drawerOpen()) { return; }
    lastFocus = document.activeElement;
    drawerEl.setAttribute("data-open", "true");
    scrimEl.setAttribute("data-open", "true");
    scrimEl.setAttribute("aria-hidden", "false");
    menuEl.setAttribute("aria-expanded", "true");
    /* 焦点移入抽屉：优先当前周，其次第一个周次（键盘用户可直接回车选中），
       最后才退回抽屉内第一个可聚焦元素。 */
    var target = listEl.querySelector('.tab[aria-current="true"]') ||
                 listEl.querySelector(".tab") ||
                 drawerEl.querySelector(FOCUSABLE);
    if (target) { target.focus(); }
  }

  function closeDrawer() {
    if (!drawerOpen()) { return; }
    tipHide(true);
    drawerEl.setAttribute("data-open", "false");
    scrimEl.setAttribute("data-open", "false");
    scrimEl.setAttribute("aria-hidden", "true");
    menuEl.setAttribute("aria-expanded", "false");
    /* 焦点回到唤出按钮 */
    var back = (lastFocus && document.contains(lastFocus)) ? lastFocus : menuEl;
    back.focus();
  }

  menuEl.addEventListener("click", function () {
    if (drawerOpen()) { closeDrawer(); } else { openDrawer(); }
  });
  closeEl.addEventListener("click", closeDrawer);
  scrimEl.addEventListener("click", closeDrawer);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (drawerOpen()) { e.preventDefault(); closeDrawer(); }
      else { tipHide(true); }
      return;
    }
    /* 快捷键：m 唤出（输入框里不触发） */
    if ((e.key === "m" || e.key === "M") && !e.ctrlKey && !e.metaKey && !e.altKey) {
      var tag = (e.target && e.target.tagName || "").toLowerCase();
      if (tag !== "input" && tag !== "textarea" && !e.target.isContentEditable) {
        e.preventDefault();
        if (drawerOpen()) { closeDrawer(); } else { openDrawer(); }
      }
      return;
    }
    /* Tab 循环约束在抽屉内 */
    if (e.key === "Tab" && drawerOpen()) {
      var items = Array.prototype.filter.call(
        drawerEl.querySelectorAll(FOCUSABLE),
        function (n) { return n.offsetParent !== null; }
      );
      if (items.length === 0) { return; }
      var first = items[0];
      var last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault(); last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault(); first.focus();
      }
    }
  });

  /* ---------------- 周列表 ---------------- */

  /* 标题与日期之间不用文本分隔符：间隔由 CSS 给（.d 的 margin-right），
     「数据检查」这类标记走独立的 .kind 小标签而不是括号文字。 */
  function buildWeek(week, index) {
    var li = el("li", "week");

    var tab = el("button", "tab");
    tab.type = "button";
    tab.setAttribute("aria-current", "false");
    tab.setAttribute("aria-controls", "panel-" + index);
    /* 标题过长时会被省略号截断，提示里给完整信息 */
    tab.setAttribute("data-tip", week.date + " " + week.title +
                               (week.kind ? "（" + week.kind + "）" : ""));

    var t = el("span", "t");
    t.textContent = week.title;
    if (week.kind) {
      var k = el("span", "kind");
      k.textContent = week.kind;
      t.appendChild(k);
    }
    var d = el("span", "d");
    d.textContent = week.date;
    tab.appendChild(t);
    tab.appendChild(d);
    tab.addEventListener("click", function () {
      activate(index);
      closeDrawer();                       /* 选中后自动收起 */
    });
    li.appendChild(tab);

    /* 每周 tab 旁边的 GitHub 八爪鱼：指向该周目录，不参与选中 */
    var src = el("a", "src");
    src.href = week.repo;
    src.target = "_blank";
    src.rel = "noopener";
    src.setAttribute("aria-label", week.date + " 在 GitHub 上的目录");
    src.setAttribute("data-tip", "在 GitHub 查看该周目录");
    src.innerHTML = '<svg class="octo" viewBox="0 0 16 16" aria-hidden="true">' +
                    '<use href="#i-octo"></use></svg>';
    li.appendChild(src);

    listEl.appendChild(li);
  }

  /* ---------------- 按需加载 ---------------- */

  function activate(index) {
    var week = weeks[index];

    nowEl.innerHTML = "";
    var d = el("span", "d");
    d.textContent = week.date;
    var t = el("span", "t");
    t.textContent = week.title;
    if (week.kind) {
      var nk = el("span", "kind");
      nk.textContent = week.kind;
      t.appendChild(nk);
    }
    nowEl.appendChild(d);
    nowEl.appendChild(t);

    var tabs = listEl.querySelectorAll(".tab");
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].setAttribute("aria-current", i === index ? "true" : "false");
    }

    /* 首次选中才创建 iframe —— 此前该周不产生任何网络请求 */
    var entry = panels[index];
    if (!entry) {
      var panel = el("div", "panel");
      panel.id = "panel-" + index;

      var hint = el("div", "hint");
      hint.textContent = "正在加载 " + week.date + "（" + week.title + "）…";
      panel.appendChild(hint);

      var frame = document.createElement("iframe");
      frame.title = week.title;
      /* 只隐藏提示，不动 iframe 本身：
         在 load 回调里替换/移除 iframe 节点会触发重复加载甚至无限循环。 */
      frame.addEventListener("load", function () { hint.hidden = true; }, { once: true });

      panel.appendChild(frame);
      stageEl.appendChild(panel);
      frame.src = week.src;   /* 赋值 src 的这一刻才真正发起请求 */

      entry = panels[index] = { panel: panel, frame: frame };
    }

    /* 只切显隐：已加载过的周留在 DOM，切回不重新请求 */
    for (var k in panels) {
      if (Object.prototype.hasOwnProperty.call(panels, k)) {
        panels[k].panel.setAttribute("data-active", String(Number(k) === index));
      }
    }
  }

  weeks.forEach(buildWeek);

  /* 周数进小标签，生成日期单独一行（它指「本页何时生成」，不是某一周的日期） */
  countEl.textContent = weeks.length + " 周";
  genEl.textContent = "生成于 " + data.generated;

  /* 进入页面直接展示最新一周（列表首项 = 目录名最大）：
     只请求这一份报告，其余周仍需用户主动选择才加载。 */
  if (weeks.length > 0) { activate(0); }
})();
</script>
</body>
</html>
