name: Check site entry page

# 职责：push 后校验根 index.html 是否与 weeks/ 同步。
#
# 为什么不再重跑 update_site.R（2026-10-02 改）：
#   1. 兜底已前移到本地 —— .githooks/pre-commit 在提交触及 weeks/ 、assets/site/ 或
#      code/update_site.R 时自动重跑 update_site.R 并把 index.html 并入本次提交。
#   2. 原兜底代价过高 —— ubuntu-latest 不预装 R（R 只在 ubuntu-22.04 镜像），
#      必须上 r-lib/actions/setup-r@v2，实测该步 27 s ~ 22 m35 s，而真正的脚本只跑 1 s。
#   3. 历史收益为零 —— 它只产出过 1 个 bot commit（38556ee，368 行全改），
#      而那是当时 CRLF 行尾 bug 造成的整份重写，不是补收录。
#
# 本检查覆盖钩子挡不住的入口：GitHub 网页端编辑、带 --no-verify 的提交、
#   以及在没跑过 git config core.hooksPath .githooks 的新 clone 上提交。
#   runner 自带 Python，秒级完成。
#
# 注意：Vercel 经 Git 集成直接监听 main，不经过本 workflow，
#       所以本检查红叉不阻断部署，它只是把「站点漏了一周」这件事变可见。
#
# 修复方式：本地跑 Rscript code/update_site.R 并提交 index.html。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-site-index
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check index.html is in sync with weeks/
        run: python3 code/check_site_index.py
